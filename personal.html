<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心</title>
  <link rel="stylesheet" href="style.css">
  <script src="utils.js"></script>
  <style>
    .user-info { text-align:center; padding:30px; background:white; max-width:500px; margin:30px auto; border-radius:10px; }
    .avatar { width:80px; height:80px; background:#ff5722; color:white; border-radius:50%; line-height:80px; font-size:24px; margin:0 auto; }
    .menu { margin-top:20px; }
    .menu-item { padding:12px; background:#f5f5f5; margin:6px 0; border-radius:6px; cursor:pointer; }
    .menu-item.logout { color:red; }
    .back-btn { position:absolute; top:20px; left:20px; padding:8px 16px; background:#f1f1f1; border:none; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>
<button class="back-btn" onclick="location.href='index.html'">← 返回主页</button>
<div class="user-info">
  <div class="avatar" id="avatar">用</div>
  <h3 id="nickname">用户</h3>
  <p id="studentId">学号：-</p>
  <div class="menu">
    <div class="menu-item" onclick="location.href='my-posts.html'">我的发布</div>
    <div class="menu-item" onclick="location.href='my-collections.html'">我的收藏</div>
    <div class="menu-item" onclick="location.href='edit-profile.html'">修改资料</div>
    <div class="menu-item logout" onclick="doLogout()">退出登录</div>
  </div>
</div>

<script>
const user = DataUtil.getCurrentUser();
if (!user) {
  alert('请先登录！');
  location.href = 'login.html';
} else {
  document.getElementById('nickname').innerText = user.nickname;
  document.getElementById('studentId').innerText = `学号：${user.studentId}`;
  document.getElementById('avatar').innerText = user.nickname[0];
}

function doLogout() {
  DataUtil.logout();
  alert('已退出登录');
  location.href = 'index.html';
}
</script>
</body>
</html>
