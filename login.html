<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <link rel="stylesheet" href="style.css">
  <script src="utils.js"></script>
  <style>
    .login-box { max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 20px #00000010; }
    .login-box h2 { text-align: center; margin-bottom: 24px; color: #ff5722; }
    .input-item { margin-bottom: 18px; }
    .input-item label { display: block; margin-bottom: 6px; font-size: 14px; }
    .input-item input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; }
    .login-btn { width: 100%; background: #ff5722; color: white; padding: 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
  </style>
</head>
<body>
<div class="navbar">
  <div class="logo" onclick="location.href='index.html'">🍜 校园美食墙</div>
  <div class="nav-buttons">
    <button class="btn login-btn" onclick="location.href='register.html'">注册</button>
  </div>
</div>

<div class="login-box">
  <h2>用户登录</h2>
  <div class="input-item">
    <label>用户名</label>
    <input type="text" id="loginUsername" placeholder="请输入用户名">
  </div>
  <div class="input-item">
    <label>密码</label>
    <input type="password" id="loginPassword" placeholder="请输入密码">
  </div>
  <button class="login-btn" onclick="doLogin()">登录</button>
  <div class="to-register" style="text-align:center;margin-top:14px;font-size:13px;">没有账号？<a href="register.html" style="color:#ff5722">立即注册</a></div>
</div>

<script>
function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  if (!username || !password) {
    alert('请输入用户名和密码！');
    return;
  }
  const user = DataUtil.login(username, password);
  if (user) {
    DataUtil.setCurrentUser(user);
    alert('登录成功！');
    location.href = 'index.html';
  } else {
    alert('用户名或密码错误！');
  }
}
</script>
</body>
</html>
